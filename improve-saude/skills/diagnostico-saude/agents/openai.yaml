interface:
  display_name: "Diagnóstico de Saúde Pública"
  short_description: "Conversa com quem faz a gestão da saúde do município, lê as planilhas sem expor dados pessoais, cruza com dados públicos (IBGE, Tesouro, Ministério da Saúde, ANS, InfoDengue) e entrega um PDF com gráficos e a marca Improve Business."
